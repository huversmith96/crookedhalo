<style>
/* Inked, hand-cut storybook details and restrained motion; all visuals are local SVG/CSS. */
.sigil{animation:sigil-wobble 7s ease-in-out infinite;transform-origin:50% 50%}
.hero:after{animation:star-drift 9s ease-in-out infinite}
.card,.gear,.feature,.storybook,.welcome-panel,.account-box,.character-form{position:relative;overflow:hidden}
.card,.gear,.feature{transition:transform .22s ease,box-shadow .22s ease}
.gear:hover,.feature:hover{transform:translateY(-3px) rotate(-.25deg);box-shadow:4px 6px 0 #05070b9c}
.map-canvas:after{content:'✦   ·      ✧       ·        ✦';position:absolute;inset:12px 0 auto;text-align:center;color:#725b48a8;font:18px Georgia;letter-spacing:1.8em;pointer-events:none;animation:star-drift 12s ease-in-out infinite}
.map-pin{animation:pin-bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.map-pin:nth-of-type(odd){animation-delay:-1.3s}.map-pin:hover,.map-pin:focus{animation-play-state:paused}
.area-sigil{display:grid;place-items:center;flex:none;width:112px;height:112px;border:3px solid #49383c;border-radius:48% 52% 44% 56%;background:radial-gradient(circle,#fff2ce,#c6a477);box-shadow:4px 5px #17131a66;animation:character-sway 4.6s ease-in-out infinite}
.halo-art{display:block;width:100%;height:auto;filter:drop-shadow(3px 4px 0 #17131a66)}
.area-sigil .halo-art{width:96px;height:96px}
.scene-illustration{max-width:150px;flex:0 0 150px}
.turn-clock{box-shadow:2px 3px 0 #47373b;position:relative;overflow:hidden}
.turn-clock.urgent{animation:clock-nudge .42s ease-in-out infinite alternate;background:#f2d1aa;border-color:#a34336}
.battle-art{float:right;width:120px;height:105px;margin:-5px 0 5px 16px}
.welcome-art{width:min(100%,420px);margin:8px auto 2px;display:block}
.illustration-note{font-size:10px;color:#6c5a4e;font-style:italic}
@keyframes sigil-wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes star-drift{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes pin-bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes character-sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
@keyframes clock-nudge{from{transform:rotate(-.4deg)}to{transform:rotate(.4deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>

function updateTop(){let c=cur();document.getElementById('top-coins').textContent=c?c.coins.toLocaleString():'0';document.getElementById('roster-count').textContent=S.chars.length;document.getElementById('side-name').textContent=c?.name||'No character';document.getElementById('side-meta').textContent=c?`${c.race} ${c.klass} · ${factions[c.faction].name}`:'';document.getElementById('side-avatar').textContent=c?factions[c.faction].icon:'✦'}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function head(k,t,s,act=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1 class="title">${t}</h1><p class="sub">${s}</p></div>${act}</div>`}function stat(a,b,c){return `<div class="stat"><label>${a}</label><strong>${b}</strong><small>${c}</small></div>`}
function level(c,k){let n=k==='pve'?'PvE':'PvP',rebirths=c[k+'Rebirth']||0,cap=c[k]>=99;return `<div class="level"><div class="cardhead"><div><h3>${n} Level</h3><small>${k==='pve'?'Adventures, quests & discovery':'Duels & faction objectives'} · 99 cap · Rebirth ${rebirths}</small></div><div class="big">${c[k]}</div></div><div class="bar"><i style="width:${cap?100:Math.min(100,c[k+'Xp'])}%"></i></div>${cap?`<small>Mastery complete · choose a permanent legacy mark and begin again at level 0.</small><button class="btn gold" style="margin-top:9px" data-action="open-rebirth" data-track="${k}">✧ Rebirth this path</button>`:`<small>${c[k+'Xp']}/100 progress to level ${c[k]+1}</small>`}</div>`}
function itemrow(it,act=''){return `<div class="item"><div class="itemicon">${it.icon}</div><div class="iteminfo"><strong class="rarity">${esc(it.name)}</strong><small>${it.rarity} ${it.slot} · +${it.power} power · ◈ ${it.value}</small></div>${act}</div>`}
function sanctuary(){let c=cur(),f=factions[c.faction];return `${head('Shared world · Your refuge','The Lantern Sanctum','A quiet outpost between known roads and the divine wilds. Your story continues whenever you return.')}<section class="hero"><div class="eyebrow">${f.icon} ${f.name}</div><h2>Every path leaves a light behind.</h2><p>The Shattered Bell has sounded again. Beyond the Sanctum, old powers stir and the three covenants gather influence. Choose a road, claim its discoveries, and carry what you find back to the world.</p><div class="actions"><button class="btn gold" data-action="expedition">Begin an expedition</button><button class="btn ghost" data-action="pvp">Enter the contested vale</button><button class="btn" onclick="go('vigil')">☾ Start an AFK vigil</button></div></section><div class="stats">${stat('PvE level',c.pve,'Adventure progression')}${stat('PvP level',c.pvp,'Separate combat progression')}${stat('Monthly faction power',(S.monthly.power[c.faction]||0).toLocaleString(),'Your faction contribution')}${stat('Equipped power',equipPower(c),'From your current build')}</div><div class="columns"><section class="card"><div class="cardhead"><h3>Two paths of mastery</h3><span class="tag">Separate progression</span></div><div class="levels">${level(c,'pve')}${level(c,'pvp')}</div><div class="notice">PvE and PvP levels advance independently. Your gear build carries across both paths.</div></section><section class="card"><div class="cardhead"><h3>World chronicle</h3><span class="tag">Local preview</span></div><div class="feed">${S.feed.slice(0,6).map(x=>`<p><span>✧</span> ${esc(x)}</p>`).join('')}</div></section></div><section class="card" style="margin-top:14px"><div class="cardhead"><h3>Three covenants, one changing world</h3><button class="btn ghost" data-action="factions">View standings</button></div><div class="factions">${Object.entries(factions).map(([id,x])=>`<article class="faction ${x.color} card"><div class="ficon">${x.icon}</div><h3>${x.name}</h3><p>${x.ideal}</p><p style="margin-top:9px;color:var(--gold)">${(S.monthly.power[id]||0).toLocaleString()} monthly power</p></article>`).join('')}</div></section>`}
function character(){let c=cur();return `${head('Your legend','Character','Grow along separate PvE and PvP paths, then refine your build with every find.','<button class="btn ghost" data-action="roster">Switch character</button>')}<section class="card"><div class="cardhead"><div><div class="eyebrow">${factions[c.faction].name}</div><h2 style="font:25px Marcellus;margin:6px 0">${esc(c.name)}</h2><div class="pillrow"><span class="pill">${c.race}</span><span class="pill">${c.klass}</span><span class="pill">Build power ${equipPower(c)}</span></div></div><button class="btn" data-action="create-char">＋ New character</button></div></section><div class="levels" style="margin:14px 0">${level(c,'pve')}${level(c,'pvp')}</div><div class="columns"><section class="card"><h3>Equipped build</h3>${['Weapon','Armor','Charm'].map(slot=>{let it=c.gear[slot];return `<div class="item"><div class="itemicon">${it?.icon||'◇'}</div><div class="iteminfo"><strong>${slot}</strong><small>${it?`${esc(it.name)} · +${it.power} power`:'Empty slot'}</small></div></div>`}).join('')}</section><section class="card"><h3>Calling & covenant</h3><p class="sub">${c.klass} draws on a distinct discipline. ${factions[c.faction].ideal}</p><div class="notice">Your race, class, and covenant belong to this character. Create another character to explore a new combination.</div></section></div>`}
function expedition(){return `${head('PvE · Exploration & loot','Expeditions','Explore strange places, overcome supernatural threats, and bring home equipment for your next build.')}<div class="callout">Expeditions advance PvE level, award loot and coin, and add to your covenant’s monthly power. PvP progression is separate.</div><div class="grid">${[['Bellwether Ruins','A drowned chapel where the first choir still sings.','⚱','Level 1–5'],['The Starfall Verge','A silver crater ringed by restless shades.','✧','Level 3–8'],['Rootbound Archive','A living library whose branches remember names.','❧','Level 5–10']].map((x,i)=>`<article class="gear"><div class="eyebrow">${x[3]} · PvE</div><div style="font:20px Marcellus;margin:10px 0 6px">${x[0]}</div><p>${x[1]}</p><div class="gearfoot"><span class="small">2–4 minutes</span><button class="btn" data-action="explore" data-zone="${i}">Explore ${x[2]}</button></div></article>`).join('')}</div><section class="card" style="margin-top:14px"><h3>Latest discoveries</h3>${S.feed.slice(0,7).map(x=>`<div class="item"><div class="itemicon">✧</div><div class="iteminfo"><small>${esc(x)}</small></div></div>`).join('')}</section>`}
function armory(){let c=cur();return `${head('Build · Find · Refine','Armory & loot','Gear shapes your build. Equip new finds, or trade and store what you do not need.')}<div class="stats">${stat('Build power',equipPower(c),'Total gear bonuses')}${stat('Bag items',c.bag.length,'Weapons, armor & charms')}${stat('Equipped',Object.values(c.gear).filter(Boolean).length,'Three gear slots')}${stat('Weekly crafts',S.weekly.craft[c.id]||0,'Artificer honor')}</div><section class="card"><div class="cardhead"><h3>Equipment bag</h3><span class="tag">${c.bag.length} items</span></div>${c.bag.length?`<div class="grid">${c.bag.map((it,i)=>`<div class="gear"><div class="gear-top"><div class="itemicon">${it.icon}</div><div class="iteminfo"><strong class="rarity">${esc(it.name)}</strong><small>${it.rarity} ${it.slot}</small></div></div><p>${it.desc}</p><div class="gearfoot"><span class="coin">+${it.power} · ◈ ${it.value}</span><button class="btn" data-action="equip" data-index="${i}">Equip</button></div><div class="gearfoot" style="margin-top:8px"><button class="btn ghost" data-action="deposit" data-index="${i}">Move to stash</button><span></span></div></div>`).join('')}</div>`:`<div class="empty">Your bag is clear. Expeditions may turn up something worth keeping.<br><button class="btn" data-action="expedition">Explore for loot</button></div>`}</section><section class="card" style="margin-top:14px"><h3>Equipped</h3>${['Weapon','Armor','Charm'].map(slot=>c.gear[slot]?itemrow(c.gear[slot],`<button class="btn ghost" data-action="unequip" data-slot="${slot}">Unequip</button>`):`<div class="item"><div class="itemicon">◇</div><div class="iteminfo"><strong>${slot}</strong><small>Empty slot</small></div></div>`).join('')}</section>`}
function stash(){let c=cur(),fee=it=>Math.max(1,Math.ceil(it.value*.03));return `${head('Shared account inventory','Account stash','Transfer tradeable gear between characters. Depositing is free; withdrawal costs 3% of listed value, rounded up, with a one-coin minimum.')}<div class="callout">Each withdrawal is charged once to the active character. Bound items cannot enter the stash.</div><div class="columns"><section class="card"><div class="cardhead"><h3>Stash · ${S.stash.length} items</h3><span class="tag">Shared across roster</span></div>${S.stash.length?S.stash.map((it,i)=>itemrow(it,`<button class="btn" data-action="withdraw" data-index="${i}">Withdraw · ◈ ${fee(it)}</button>`)).join(''):`<div class="empty">No gear stored yet.<br><span class="small">Deposit an item from the Armory to pass it between your characters.</span></div>`}</section><section class="card"><h3>Account roster</h3>${S.chars.map((x,i)=>`<div class="item"><div class="itemicon">${factions[x.faction].icon}</div><div class="iteminfo"><strong>${esc(x.name)}${i===S.active?' · Active':''}</strong><small>${x.race} ${x.klass} · PvE ${x.pve} / PvP ${x.pvp}</small></div>${i!==S.active?`<button class="btn ghost" data-action="switch" data-index="${i}">Select</button>`:''}</div>`).join('')}<button class="btn" data-action="create-char">＋ Create character</button></section></div>`}
function market(){return `${head('Player economy','Trade market','Browse listings and sell discoveries. Online listings would be shared between players.')}<div class="callout">Market interactions are local to this browser. Shared player listings need the online game service.</div><div class="columns"><section class="card"><h3>Available listings</h3>${S.market.length?S.market.map((x,i)=>itemrow(x,`<button class="btn" data-action="buy" data-index="${i}">Buy · ◈ ${x.price}</button>`)).join(''):`<div class="empty">No community listings yet.<br><span class="small">The market fills when players list items in the connected world.</span></div>`}</section><section class="card"><h3>List an item</h3><p class="sub">Turn a spare find into coin. Listed items leave your character bag.</p><div class="minilist" style="margin-top:12px">${cur().bag.length?cur().bag.map((it,i)=>`<div class="mini"><span>${it.icon}</span>${esc(it.name)} · ◈${it.value}<button class="btn ghost" style="margin-left:auto;padding:6px 9px" data-action="sell-list" data-index="${i}">List</button></div>`).join(''):'<span class="small">No items available.</span>'}</div></section></div>`}
function ranking(map){let a=Object.entries(map).map(([id,score])=>({id,score,name:S.chars.find(c=>c.id===id)?.name||'Wayfarer'})).sort((x,y)=>y.score-x.score);return a.length?a.slice(0,8).map((x,i)=>`<tr><td class="rank">${String(i+1).padStart(2,'0')}</td><td>${esc(x.name)}${x.id===cur().id?' <span class="you">YOU</span>':''}</td><td>${x.score.toLocaleString()}</td></tr>`).join(''):`<tr><td colspan="3" class="small">No points yet this week. Make the first mark.</td></tr>`}
function factionsPage(){let ranked=Object.entries(S.monthly.power).sort((a,b)=>b[1]-a[1]);return `${head('Faction conflict · Monthly standings','The living contest','Weekly honors recognize individual paths. Monthly faction power measures covenant influence across the world.')}<div class="stats">${stat('Contest month',S.monthly.month,'Monthly power cycle')}${stat('Your covenant',factions[cur().faction].name,'Character allegiance')}${stat('Faction contribution',(S.monthly.power[cur().faction]||0).toLocaleString(),'Monthly power')}${stat('Weekly cycle',S.weekly.week,'Individual ranks reset weekly')}</div><section class="card"><div class="cardhead"><h3>Monthly faction power</h3><span class="tag gold">Persistent world · monthly cycle</span></div><table class="table"><thead><tr><th>Standing</th><th>Covenant</th><th>Power</th></tr></thead><tbody>${ranked.map(([id,p],i)=>`<tr><td class="rank">${String(i+1).padStart(2,'0')}</td><td>${factions[id].icon} ${factions[id].name}${id===cur().faction?' <span class="you">YOUR COVENANT</span>':''}</td><td>${p.toLocaleString()}</td></tr>`).join('')}</tbody></table><p class="small">Past monthly results remain in the chronicle when a new cycle begins.</p></section><section class="card" style="margin-top:14px"><div class="cardhead"><h3>Weekly individual honors</h3><span class="tag">Resets each week</span></div><div class="tabs" id="weekly-tabs"><button class="active" data-tab="pvp">PvP Vanguard</button><button data-tab="pve">Wayfinder</button><button data-tab="craft">Artificer</button><button data-tab="explore">Worldseeker</button><button data-tab="territory">Territory</button></div><table class="table"><thead><tr><th>Rank</th><th>Character</th><th>Honor</th></tr></thead><tbody id="weekly-body"></tbody></table></section><div class="factions" style="margin-top:14px">${Object.entries(factions).map(([id,f])=>`<article class="faction ${f.color} card"><div class="ficon">${f.icon}</div><h3>${f.name}</h3><p>${f.ideal}</p></article>`).join('')}</div>`}
function codex(){return `${head('Rules & world lore','Wayfarer’s codex','A quick guide to Crooked Halo’s character paths, world cycles, and economy.')}<div class="columns"><section class="card"><h3>Character paths</h3><p class="sub">Each character has independent PvE and PvP levels. Quests and expeditions advance PvE; duels and contested objectives advance PvP. Gear shapes both builds.</p><h3 style="margin-top:22px">Covenants</h3><p class="sub">The Radiant Concord, Gloaming Choir, and Verdant Covenant are philosophies, not moral alignments. Any race and class can choose any covenant.</p><h3 style="margin-top:22px">Account roster</h3><p class="sub">One account holds multiple characters, each with separate levels, equipment, and allegiance. Tradeable gear moves through the account stash for a small coin fee.</p></section><section class="card"><h3>World cycles</h3><p class="sub">The world has no final ending. Monthly faction power shifts the contest; the archive remembers past results. Weekly rankings celebrate different contributions and reset for a fresh climb.</p><h3 style="margin-top:22px">Economy & loot</h3><p class="sub">Creatures and adventures can drop equipment and coin. Gear can be equipped, traded, sold, or stored. Crafting and market play add more routes into the economy.</p><div class="notice">This prototype saves locally in your browser. Shared real-time players, guilds, chat, and server-wide economy require an online service.</div></section></div>`}
function render(){updateTop();document.getElementById('main').innerHTML=({sanctuary,character,expedition,armory,stash,market,factions:factionsPage,codex})[page]();if(page==='factions'){let body=document.getElementById('weekly-body'),tabs=document.getElementById('weekly-tabs');S.weekly.territory=S.weekly.territory||{};body.innerHTML=ranking(S.weekly.pvp);tabs.onclick=e=>{let b=e.target.closest('[data-tab]');if(!b)return;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));body.innerHTML=ranking(S.weekly[b.dataset.tab]||{})}}}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalwrap').classList.add('open')}function closeModal(){document.getElementById('modalwrap').classList.remove('open')}document.getElementById('modalwrap').addEventListener('click',e=>{if(e.target.id==='modalwrap'||e.target.closest('[data-close]'))closeModal()});
function roster(){openModal(`<h2>Character roster</h2><p>Each character keeps a separate path, covenant, and equipment build.</p>${S.chars.map((x,i)=>`<div class="item"><div class="itemicon">${factions[x.faction].icon}</div><div class="iteminfo"><strong>${esc(x.name)}${i===S.active?' · Active':''}</strong><small>${x.race} ${x.klass} · PvE ${x.pve} · PvP ${x.pvp}</small></div>${i!==S.active?`<button class="btn ghost" data-action="switch" data-index="${i}">Play</button>`:''}</div>`).join('')}<div class="modalactions"><button class="btn ghost" data-close>Close</button><button class="btn" data-action="create-char">＋ New character</button></div>`)}
function createChar(){openModal(`<h2>Create a character</h2><p>Choose a new combination to explore another path through the world.</p><form id="char-form"><div class="formgrid"><div class="field full"><label>Character name</label><input name="name" required minlength="2" maxlength="20" placeholder="Choose a name"></div><div class="field"><label>Race</label><select name="race">${races.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Class</label><select name="klass">${classes.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field full"><label>Covenant</label><select name="faction">${Object.entries(factions).map(([id,x])=>`<option value="${id}">${x.icon} ${x.name} — ${x.ideal}</option>`).join('')}</select></div></div><div class="modalactions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn gold">Create character</button></div></form>`);document.getElementById('char-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim();if(!name)return;S.chars.push({id:crypto.randomUUID(),name,race:f.get('race'),klass:f.get('klass'),faction:f.get('faction'),originStory:characterOriginStory(f.get('race'),f.get('klass'),f.get('faction')),pve:1,pveXp:0,pvp:1,pvpXp:0,coins:80,bag:[{id:'starter-'+Date.now(),name:'Traveler’s Blade',slot:'Weapon',icon:'⚔',rarity:'Common',power:2,value:12,desc:'A dependable first steel.'}],gear:{Weapon:null,Armor:null,Charm:null}});S.active=S.chars.length-1;addFeed(`${name} arrived at the Lantern Sanctum.`);closeModal();go('character')}}
function award(c,k,n){if(c[k]>=99){c[k+'Xp']=0;return}let legacy=c[k+'Rebirth']||0;c[k+'Xp']+=Math.round(n*(1+legacy*.05));while(c[k+'Xp']>=100&&c[k]<99){c[k+'Xp']-=100;c[k]++;addFeed(`${c.name} reached ${k==='pve'?'PvE':'PvP'} level ${c[k]}.`)}if(c[k]>=99)c[k+'Xp']=0}
function explore(){let c=cur(),foe=['a bell-wraith','a shardling','a rootbound sentinel'][Math.floor(Math.random()*3)],won=Math.random()<Math.min(.96,.68+equipPower(c)*.025+c.pve*.015),xp=won?28:12,coin=won?24+Math.floor(Math.random()*20):8;award(c,'pve',xp);c.coins+=coin;points(S.weekly.pve,c.id,won?12:5);points(S.weekly.explore,c.id,8);power(c.faction,won?18:9);let drop=null;if(won&&Math.random()<.75){drop={...loot[Math.floor(Math.random()*loot.length)],id:'drop-'+crypto.randomUUID()};c.bag.push(drop)}let out=won?`You overcame ${foe}. +${xp} PvE XP, ◈${coin}${drop?', found '+drop.name:''}.`:`${foe} drove you back, but you charted the route. +${xp} PvE XP, ◈${coin}.`;addFeed(out);render();message(out)}
function spar(){let c=cur(),our=equipPower(c)+c.pvp*2+Math.random()*8,enemy=12+Math.random()*18,won=our>=enemy,xp=won?25:11;award(c,'pvp',xp);points(S.weekly.pvp,c.id,won?15:6);power(c.faction,won?20:8);c.coins+=won?16:6;let out=won?'You won the sanctioned spar.':'A close spar went to your rival.';addFeed(`${out} +${xp} PvP XP; faction influence recorded.`);render();message(`${out} Local training simulation, not a live player match. +${xp} PvP XP and ${won?15:6} weekly Vanguard honor.`)}
function message(s){openModal(`<h2>Wayfarer’s note</h2><p>${esc(s)}</p><div class="modalactions"><button class="btn" data-close>Continue</button></div>`)}
function act(a,b){let c=cur(),i=Number(b?.dataset.index);switch(a){case'expedition':go('expedition');break;case'factions':go('factions');break;case'roster':roster();break;case'create-char':closeModal();createChar();break;case'pvp':spar();break;case'explore':explore(b?.dataset.zone||0);break;case'equip':{let it=c.bag.splice(i,1)[0],old=c.gear[it.slot];if(old)c.bag.push(old);c.gear[it.slot]=it;render();save();message(`${it.name} equipped. Build power is ${equipPower(c)}.`);break}case'unequip':{let it=c.gear[b.dataset.slot];if(it)c.bag.push(it);c.gear[b.dataset.slot]=null;render();save();break}case'deposit':{let it=c.bag.splice(i,1)[0];S.stash.push(it);render();save();message(`${it.name} stored. Depositing is free.`);break}case'withdraw':{let it=S.stash[i],fee=Math.max(1,Math.ceil(it.value*.03));if(c.coins<fee){message(`This transfer costs ◈${fee}; ${c.name} has ◈${c.coins}.`);break}c.coins-=fee;S.stash.splice(i,1);c.bag.push(it);addFeed(`${c.name} withdrew ${it.name} for ◈${fee}.`);render();message(`${it.name} moved to ${c.name}. The 3% transfer tax was ◈${fee}.`);break}case'switch':S.active=i;closeModal();render();break;case'sell-list':{let it=c.bag.splice(i,1)[0];S.market.push({...it,price:it.value,id:'listing-'+crypto.randomUUID()});render();save();break}case'buy':{let it=S.market[i];if(c.coins<it.price){message('Not enough coin for this listing.');break}c.coins-=it.price;c.bag.push({...it,id:'buy-'+crypto.randomUUID()});S.market.splice(i,1);render();save();message(`${it.name} purchased.`);break}}}
const raceLore={
 Human:{mark:'♙',origin:'The bellfounder’s children',desc:'Humans arrived after the first divine silence. Their lives are brief, their keepsakes stubbornly durable; a human can turn a promise into a whole city.',play:'Balanced beginnings; adaptable gear paths.',stats:{Might:1,Vigor:1,Grace:1,Insight:1,Spirit:1}},

const ancestryThreads={Human:'Your family kept a place at its table for the unexplainable. The night you were born, the house bell rang once with no rope attached, and every candle leaned toward your cradle.',Aurelian:'A loose halo-fragment chose your shadow before you could speak. It never made you holy; it simply left a bright seam through which the unseen could recognize you.',Sylvan:'The seed carried by your kin split open at your naming. A root curled around your wrist like a small green oath, then sank back beneath the floorboards.',Stonekin:'A hairline of warm gold appeared in your mineral markings. The elders called it a mountain remembering a promise, though none could agree whose promise it was.','Umbral-born':'At your first cry, your shadow turned toward the door instead of the window. The household understood that you would always notice the passage everyone else had mistaken for a wall.',Tidecaller:'A star appeared in the washbasin water on the evening you arrived. It followed your family for three tides, then vanished into the reflection of your eyes.'};
const callingAwakenings={Oathblade:'You spoke your first binding vow over a chipped blade, promising to stand between a frightened stranger and the thing wearing their mother’s face.',Oracle:'You foretold a small disaster—a blue candle, a cracked cup, a guest who had not yet knocked—and then stayed to help when every detail came true.',Warden:'You found a boundary stone walking away from its hill. You held it in place through a night of whispering, and woke with its map scratched across your shield hand.',Veilstalker:'You followed a second set of footprints that began where yours ended. At dawn you returned with a missing child, dry boots, and a map of streets no town admitted having.',Cantor:'You hummed to calm a chapel bell that had begun screaming. The bell answered in harmony, and the frightened souls hiding in its bronze finally slept.',Artificer:'You repaired a dead lantern with a watch spring, a saint’s button, and a drop of rain from yesterday. Something inside the lamp thanked you by name.',Dawnpriest:'After a fire, you sat with the living until sunrise and guided the dead to the door. The dawn came late, as if it had been waiting for you to finish.',Riftweaver:'A doorway opened in a blank wall and showed you a room from your childhood that had never existed. You stitched the seam shut, keeping one impossible thread.'};
const callingMarks={Oathblade:'the vow-mark',Oracle:'the double reflection',Warden:'the boundary scar',Veilstalker:'the dry-footprint sign',Cantor:'the answering note',Artificer:'the warm brass mark',Dawnpriest:'the held dawn',Riftweaver:'the impossible thread'};
function characterOriginStory(race,klass,faction){let r=raceLore[race],c=classLore[klass],f=factions[faction];if(!r||!c)return '';let combined={...r.stats};Object.entries(c.stats).forEach(([k,v])=>combined[k]=(combined[k]||0)+v);let lean=Object.entries(combined).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]).join(' and ');let covenant=f?' The '+f.name+' gave you shelter, not a verdict: its keepers believed your strange beginning could serve the world without defining your conscience.':' You chose your own road before any covenant could claim to understand you.';return ancestryThreads[race]+' '+callingAwakenings[klass]+' In the old ledgers, a '+race+' '+klass+' is said to carry '+callingMarks[klass]+': a sign that ancestry and calling met at precisely the wrong—and therefore necessary—moment. Your '+r.origin.toLowerCase()+' inheritance lends you '+lean+'; your '+c.role.toLowerCase()+' calling teaches you what to do with it.'+covenant}

function derived(c){let a={Might:5,Vigor:5,Grace:5,Insight:5,Spirit:5};for(let [k,v] of Object.entries(raceLore[c.race]?.stats||{}))a[k]+=v;for(let [k,v] of Object.entries(classLore[c.klass]?.stats||{}))a[k]+=v;for(let mark of c.legacyMarks||[])if(a[mark.stat]!==undefined)a[mark.stat]+=2;for(let buff of c.buffs||[])if(buff.type==='stats'&&buff.expires>Date.now())for(let [k,v] of Object.entries(buff.stats||{}))if(a[k]!==undefined)a[k]+=v;for(let it of Object.values(c.gear||{})){if(!it)continue;let p=it.power||0,mods=it.mods||(it.slot==='Weapon'?{Might:Math.ceil(p*.8),Grace:Math.ceil(p*.25)}:it.slot==='Armor'?{Vigor:Math.ceil(p*.8),Spirit:Math.ceil(p*.2)}:{Insight:Math.ceil(p*.7),Spirit:Math.ceil(p*.5)});for(let [k,v]of Object.entries(mods))a[k]+=v}return {a,hp:50+a.Vigor*8,attack:10+a.Might*2+(c.gear.Weapon?.power||0),guard:5+a.Vigor*2+(c.gear.Armor?.power||0),speed:5+a.Grace,ward:5+a.Insight+a.Spirit*2,crit:5+Math.floor(a.Grace*.7)}}
function statstrip(c){let d=derived(c);return `<div class="attribute-grid">${Object.entries(d.a).map(([k,v])=>`<div class="attribute"><small>${k}</small><strong>${v}</strong></div>`).join('')}</div><div class="combat-grid" style="margin-top:10px">${[['Vitality',d.hp],['Attack',d.attack],['Guard',d.guard],['Speed',d.speed],['Ward',d.ward],['Critical chance',d.crit+'%']].map(([k,v])=>`<div class="combat-stat"><span class="small">${k}</span><b>${v}</b></div>`).join('')}</div>`}
function modsText(it){let p=it.power||0,m=it.mods||(it.slot==='Weapon'?{Might:Math.ceil(p*.8),Grace:Math.ceil(p*.25)}:it.slot==='Armor'?{Vigor:Math.ceil(p*.8),Spirit:Math.ceil(p*.2)}:{Insight:Math.ceil(p*.7),Spirit:Math.ceil(p*.5)});return Object.entries(m).map(([k,v])=>`${k} +${v}`).join(' · ')}
function character(){let c=cur(),r=raceLore[c.race],cl=classLore[c.klass];return `${head('Your legend','Character','Your ancestry and calling shape your build. Gear adds its own measurable bonuses.','<button class="btn ghost" data-action="roster">Switch character</button>')}<section class="storybook chapter"><div class="chaptermark">${r.mark}</div><div><div class="eyebrow">${r.origin}</div><h3>${esc(c.name)} · ${c.race} ${c.klass}</h3><p>${r.desc}</p><p class="illustration-note">Ancestry: ${r.play}</p></div></section><section class="storybook origin-story"><div class="eyebrow">✧ How this wayfarer came to be · ${c.race} ${c.klass}</div><p>${esc(c.originStory||characterOriginStory(c.race,c.klass,c.faction))}</p></section><div class="levels" style="margin:14px 0">${level(c,'pve')}${level(c,'pvp')}</div><section class="card"><div class="cardhead"><h3>Build attributes</h3><span class="tag">Base + ancestry + calling + equipped gear</span></div>${statstrip(c)}</section><div class="columns" style="margin-top:14px"><section class="card"><h3>Calling · ${cl.role}</h3><p class="lore-text">${cl.desc}</p><div class="mini-lore"><span class="tag">${cl.mark} ${c.klass}</span><span class="tag">${r.mark} ${c.race}</span></div></section><section class="card"><h3>Equipped build · ${equipPower(c)} power</h3>${['Weapon','Armor','Charm'].map(slot=>{let it=c.gear[slot];return `<div class="item"><div class="itemicon">${it?.icon||'◇'}</div><div class="iteminfo"><strong>${slot}</strong><small>${it?`${esc(it.name)} · ${modsText(it)}`:'Empty slot'}</small></div></div>`}).join('')}<div class="notice">Derived combat values combine your five attributes and the gear you wear.</div></section></div><section class="card" style="margin-top:14px"><div class="cardhead"><h3>Calling & covenant</h3><span class="tag">${factions[c.faction].name}</span></div><p class="lore-text">${factions[c.faction].ideal} The covenants disagree about how to live alongside the unseen; none claims a monopoly on virtue.</p><button class="btn" data-action="create-char" style="margin-top:12px">＋ New character</button></section>`}
function armory(){let c=cur(),d=derived(c),items=[...c.bag.map((it,i)=>({it,i}))];return `${head('Build · Find · Refine','Armory & loot','Compare item bonuses against your current build. Every weapon, coat, and charm bends your character in a different direction.')}<div class="stats">${stat('Equipped power',equipPower(c),'Sum of equipped item power')}${stat('Attack',d.attack,'Might + weapon power')}${stat('Guard',d.guard,'Vigor + armor')}${stat('Ward',d.ward,'Insight + Spirit')}</div><div class="callout">Item bonuses: weapons favor Might and Grace; armor favors Vigor and Spirit; charms favor Insight and Spirit. Equip a piece to see your derived stats update.</div><section class="card"><div class="cardhead"><h3>Equipment bag</h3><span class="tag">${c.bag.length} items · ${Object.values(c.gear).filter(Boolean).length}/3 slots equipped</span></div>${items.length?`<div class="grid">${items.map(({it,i})=>`<article class="gear"><div class="gear-top"><div class="itemicon">${it.icon}</div><div class="iteminfo"><strong class="rarity">${esc(it.name)}</strong><small>${it.rarity} ${it.slot} · value ◈${it.value}</small></div></div><p>${esc(it.desc)}</p><div class="statmods">Build bonuses: <b>${modsText(it)}</b><br>Item power: ${it.power} · transfer value: ◈${it.value}${it.eventLimited?'<br><b>Weekbound · '+esc(it.eventName)+'</b>':''}</div><div class="gearfoot"><span class="small">${c.gear[it.slot]?`Replaces ${esc(c.gear[it.slot].name)}`:'Slot is empty'}</span><button class="btn" data-action="equip" data-index="${i}">Equip</button></div><div class="gearfoot" style="margin-top:8px"><button class="btn ghost" data-action="deposit" data-index="${i}">Move to stash</button><span class="small">${it.rarity} find</span></div></article>`).join('')}</div>`:`<div class="empty">Your bag is clear. Expeditions may turn up something worth keeping.<br><button class="btn" data-action="expedition">Explore for loot</button></div>`}</section><section class="card" style="margin-top:14px"><div class="cardhead"><h3>Equipped pieces</h3><span class="tag">${equipPower(c)} combined power</span></div>${['Weapon','Armor','Charm'].map(slot=>c.gear[slot]?itemrow(c.gear[slot],`<button class="btn ghost" data-action="unequip" data-slot="${slot}">Unequip</button>`):`<div class="item"><div class="itemicon">◇</div><div class="iteminfo"><strong>${slot}</strong><small>Empty slot · no bonuses</small></div></div>`).join('')}</section>`}
function expedition(){let sites=[{name:'Bellwether Ruins',icon:'⚱',rank:'Level 1–5',desc:'A drowned chapel leans over a black pond. The bell rings underwater at noon, and the drowned congregation turns its faces toward the sound.',threat:'Bell-wraiths · echoing bells · relic caches'},{name:'The Starfall Verge',icon:'✧',rank:'Level 3–8',desc:'A silver crater splits the moor. Shards of the fallen star whisper the names of people who have not been born yet.',threat:'Star-shades · unstable light · rare charms'},{name:'Rootbound Archive',icon:'❧',rank:'Level 5–10',desc:'A library grown from a blind tree. Its roots preserve every forgotten story; some stories have begun reading themselves aloud.',threat:'Rootbound sentinels · living maps · craft materials'}];return `${head('The crooked country · PvE','Expeditions','Each road has its own haunting. Bring a good weapon, a story worth protecting, and room in your bag.')}<section class="storybook chapter"><div class="chaptermark">☾</div><div><div class="eyebrow">Field note · Sister Sunday, Keeper of the Bell</div><h3>The world did not end. It bent.</h3><p>When the First Halo cracked, heaven did not fall so much as lean close. Its fragments became saints, omens, hungry little gods, and the strange rules that govern the roads between towns. The covenants disagree about what the world should do with these visitors. You have arrived just as the old bell begins to answer them.</p></div></section><div class="callout">Expeditions advance PvE level and award loot, coin, weekly Wayfinder honor, and monthly covenant power. Item stats are shown in the Armory.</div><div class="grid">${sites.map((x,i)=>`<article class="gear"><div class="eyebrow">${x.rank} · PvE</div><div style="display:flex;gap:10px;align-items:center;margin:10px 0"><div class="itemicon">${x.icon}</div><h3 style="margin:0;font:20px Georgia">${x.name}</h3></div><p>${x.desc}</p><div class="statmods"><b>Known signs:</b> ${x.threat}</div><div class="gearfoot"><span class="small">A short, repeatable delve</span><button class="btn" data-action="explore" data-zone="${i}">Take the road</button></div></article>`).join('')}</div><section class="card" style="margin-top:14px"><h3>Recent marks in the chronicle</h3>${S.feed.slice(0,7).map(x=>`<div class="item"><div class="itemicon">✧</div><div class="iteminfo"><small>${esc(x)}</small></div></div>`).join('')}</section>`}
function codex(){return `${head('Rules, origins & strange lore','Wayfarer’s codex','A field guide to the people, callings, powers, and bargains of Crooked Halo.')}<section class="storybook chapter"><div class="chaptermark">☼</div><div><div class="eyebrow">The first crooked miracle</div><h3>A halo is a promise with a crack in it.</h3><p>Long ago, the sky wore one perfect ring. When it broke, every fragment became a different kind of wonder: a spirit in a teacup, an angel with moth wings, a road that leads into yesterday. The three covenants formed to decide how mortals and the supernatural might share one unsettled world.</p></div></section><div class="raceclass-grid"><section class="card"><h3>Peoples of the bent world</h3>${Object.entries(raceLore).map(([name,r])=>`<div class="mini-lore"><b>${r.mark} ${name} · ${r.origin}</b><p class="lore-text">${r.desc}</p><small class="small">${r.play} Starting lean: ${Object.entries(r.stats).filter(([,v])=>v).map(([k,v])=>`${k} +${v}`).join(' · ')}</small></div>`).join('')}</section><section class="card"><h3>Callings</h3>${Object.entries(classLore).map(([name,c])=>`<div class="mini-lore"><b>${c.mark} ${name} · ${c.role}</b><p class="lore-text">${c.desc}</p><small class="small">Starting lean: ${Object.entries(c.stats).filter(([,v])=>v).map(([k,v])=>`${k} +${v}`).join(' · ')}</small></div>`).join('')}</section></div><div class="columns" style="margin-top:14px"><section class="card"><h3>Five build attributes</h3><p class="lore-text"><b>Might</b> improves attack. <b>Vigor</b> raises vitality and guard. <b>Grace</b> improves speed and critical chance. <b>Insight</b> strengthens warding and supernatural awareness. <b>Spirit</b> adds ward against uncanny forces. Race and class create a base; equipped gear changes the final values.</p></section><section class="card"><h3>Three covenants</h3>${Object.values(factions).map(f=>`<div class="mini-lore"><b>${f.icon} ${f.name}</b><p class="lore-text">${f.ideal}</p></div>`).join('')}</section></div><div class="notice">Weekly honor boards reset each week. Monthly covenant power tracks the larger contest. PvE and PvP levels are separate character progressions. Your account roster may include multiple characters.</div>`}
function createChar(){openModal(`<h2>Make a new wayfarer</h2><p>Choose a people, a calling, and a covenant. Their stories and starting attributes shape a distinct build.</p><form id="char-form"><div class="formgrid"><div class="field full"><label>Character name</label><input name="name" required minlength="2" maxlength="20" placeholder="Choose a name"></div><div class="field"><label>People</label><select name="race">${races.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Calling</label><select name="klass">${classes.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="select-lore" id="choice-lore"></div><div class="field full"><label>Covenant</label><select name="faction">${Object.entries(factions).map(([id,x])=>`<option value="${id}">${x.icon} ${x.name} — ${x.ideal}</option>`).join('')}</select></div></div><div class="modalactions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn gold">Create character</button></div></form>`);let form=document.getElementById('char-form'),update=()=>{let r=raceLore[form.race.value],c=classLore[form.klass.value];document.getElementById('choice-lore').innerHTML=`<b>${r.mark} ${r.origin}</b> — ${r.desc}<br><b>${c.mark} ${form.klass.value} · ${c.role}.</b> ${c.desc}<div class="origin-preview"><b>✧ Origin of this pairing</b><br>${characterOriginStory(form.race.value,form.klass.value,form.faction.value)}</div><span class="small">Race: ${Object.entries(r.stats).filter(([,v])=>v).map(([k,v])=>`${k} +${v}`).join(' · ')} | Class: ${Object.entries(c.stats).filter(([,v])=>v).map(([k,v])=>`${k} +${v}`).join(' · ')}</span>`};form.race.onchange=update;form.klass.onchange=update;form.faction.onchange=update;update();form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),name=f.get('name').trim();if(!name)return;S.chars.push({id:crypto.randomUUID(),name,race:f.get('race'),klass:f.get('klass'),faction:f.get('faction'),originStory:characterOriginStory(f.get('race'),f.get('klass'),f.get('faction')),pve:1,pveXp:0,pvp:1,pvpXp:0,coins:80,potions:2,bag:[{id:'starter-'+Date.now(),name:'Traveler’s Blade',slot:'Weapon',icon:'⚔',rarity:'Common',power:2,value:12,desc:'A dependable first steel.'}],gear:{Weapon:null,Armor:null,Charm:null}});S.active=S.chars.length-1;addFeed(`${name} arrived at the Lantern Sanctum.`);closeModal();go('character')}}

function battleView(){let b=S.combat,c=cur(),skill=skillInfo[c.klass]||['Calling skill','A focused supernatural technique.'];if(!b)return `${head('The road is quiet','No encounter','Choose a place on the map to begin an encounter.')}<button class="btn" data-action="expedition">Open world map</button>`;b.timerEnd=b.timerEnd||Date.now()+12000;let heroPct=Math.max(0,Math.floor(b.hp/b.maxHp*100)),foePct=Math.max(0,Math.floor(b.enemy.hp/b.enemy.max*100)),sec=Math.max(0,Math.ceil((b.timerEnd-Date.now())/1000)),clockPct=Math.max(0,Math.min(100,(b.timerEnd-Date.now())/12000*100)),isTerritory=b.mode==='territory',isPvp=b.mode==='pvp'||isTerritory,title=isTerritory?'PvP · Territory skirmish':isPvp?'PvP · Sanctioned practice':'PvE · Expedition encounter',track=isTerritory?'Region claim':isPvp?'Separate PvP progression':'Separate PvE progression',description=isTerritory?'Challenge a rival covenant champion for control of this region.':'Choose a move on your turn. When the countdown ends, you automatically strike.',tag=isTerritory?'Region claim':isPvp?'Practice duel':'Crooked country';return `${head(title,b.enemy.name,b.enemy.lore)}<section class="battle"><div class="battle-head"><div><div class="eyebrow">${track}</div><h2>${b.enemy.name}</h2><p>${isTerritory?description:isPvp?'A local training rival. Live player combat is not connected yet.':description}</p></div><span class="tag">${tag}</span></div><div class="turn-clock"><span>⌛</span><span>Your next action · auto-strike in</span><strong id="turn-number">${sec}</strong><div class="bar"><i id="turn-bar" style="width:${clockPct}%"></i></div></div><div class="battle-bars"><div class="meter"><label><span>${b.enemy.name}</span><b>${Math.max(0,b.enemy.hp)} / ${b.enemy.max}</b></label><div class="bar"><i style="width:${foePct}%"></i></div></div><div class="meter player"><label><span>${esc(c.name)}</span><b>${Math.max(0,b.hp)} / ${b.maxHp}</b></label><div class="bar"><i style="width:${heroPct}%"></i></div></div></div><div class="combat-grid"><div class="combat-stat"><span class="small">Attack</span><b>${derived(c).attack}</b></div><div class="combat-stat"><span class="small">Guard</span><b>${derived(c).guard}${b.guarding?' · braced':''}</b></div><div class="combat-stat"><span class="small">Focus</span><b>${b.focus} / 3</b></div><div class="combat-stat"><span class="small">Remedies</span><b>${c.potions??2}</b></div></div><div class="battle-actions"><button class="btn gold" data-action="battle-attack">⚔ Strike</button><button class="btn" data-action="battle-skill" ${b.focus<=0?'disabled':''}>✧ ${skill[0]} · 1 focus</button><button class="btn ghost" data-action="battle-guard">⬡ Guard</button><button class="btn ghost" data-action="battle-potion" ${(c.potions??2)<=0?'disabled':''}>☼ Use remedy</button><button class="btn ghost" data-action="battle-flee">Retreat</button></div><div class="skill-note">${skill[1]} One action resolves per turn; your next turn begins after the foe responds.</div><div class="battle-log" style="margin-top:13px">${b.log.slice(0,8).map(x=>`<p>${esc(x)}</p>`).join('')}</div></section>`}

function chatPanel(){let c=cur(),channel=S.chatChannel==='faction'?'faction':'world',messages=(S.chat||[]).filter(m=>channel==='world'?m.channel==='world':m.channel==='faction'&&m.faction===c.faction).slice(-80);return `<section class="chat-panel"><div class="cardhead"><div><div class="eyebrow">The Sanctum’s speaking tube</div><h3>Community chat</h3></div><span class="tag">Local preview</span></div><div class="chat-tabs"><button type="button" data-chat-channel="world" class="${channel==='world'?'active':''}">✧ World</button><button type="button" data-chat-channel="faction" class="${channel==='faction'?'active':''}">${factions[c.faction].icon} ${factions[c.faction].name}</button></div><div class="chat-log" id="chat-log" aria-live="polite">${messages.length?messages.map(m=>`<div class="chat-line"><time>${new Date(m.time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time><strong>${esc(m.sender)}</strong> · ${esc(m.text)}</div>`).join(''):'<div class="chat-empty"><span>⌁</span>No messages yet. Leave the first local echo.</div>'}</div><form class="chat-compose" id="chat-form"><input name="message" maxlength="240" autocomplete="off" placeholder="Say something to ${channel==='world'?'the world':esc(factions[c.faction].name)}…" aria-label="Chat message" required><button class="btn gold">Send</button></form><div class="chat-note">Messages are saved in this browser for the prototype. A shared live chat server is needed for other players to see them.</div></section>`}
function chapterPanel(){let c=cur(),current=(S.chapters||[]).find(x=>x.members.includes(c.id));return `<section class="chapter-panel"><div class="cardhead"><div><div class="eyebrow">Covenant circles</div><h3>Chapters</h3></div><span class="tag">Subgroups within a faction</span></div><p class="small">Create a chapter in ${factions[c.faction].name}, or join one. Each character may belong to one chapter of their covenant.</p><form class="chapter-create" id="chapter-form"><input name="name" maxlength="28" minlength="3" placeholder="Name your new chapter" aria-label="Chapter name" required><button class="btn gold">＋ Create in ${esc(factions[c.faction].name)}</button></form><div class="chapter-groups">${Object.entries(factions).map(([id,f])=>{let list=(S.chapters||[]).filter(x=>x.faction===id);return `<div class="chapter-group"><h4>${f.icon} ${f.name} · ${list.length} chapter${list.length===1?'':'s'}</h4>${list.length?list.map(ch=>{let member=ch.members.includes(c.id);return `<div class="chapter-row"><div><strong>${esc(ch.name)}${member?' · Your chapter':''}</strong><small>${ch.members.length} wayfarer${ch.members.length===1?'':'s'} · Founded by ${esc(ch.founder)}</small></div>${id===c.faction?`<button class="btn ${member?'ghost':''}" data-action="${member?'leave-chapter':'join-chapter'}" data-chapter="${ch.id}">${member?'Leave':'Join'}</button>`:''}</div>`}).join(''):'<div class="chapter-empty">No chapters have been founded here yet.</div>'}</div>`}).join('')}</div></section>`}

function leaderboardIncentives(){return `<section class="incentive-panel"><div class="cardhead"><div><div class="eyebrow">Prizes for the climb</div><h3>Leaderboard incentives</h3></div><span class="tag gold">Preview · paid at cycle close</span></div><div class="incentive-grid"><article class="incentive-card"><div class="incentive-mark">✧</div><h4>Weekly individual honors</h4><p>Each weekly board has its own podium. Earn at least 25 honor in that category to qualify for a cycle reward.</p><div class="reward-row"><span>Participation · 25+ honor</span><b>◈ 25</b></div><div class="reward-row"><span>1st · weekly laurel title</span><b>◈ 200</b></div><div class="reward-row"><span>2nd · silver echo title</span><b>◈ 120</b></div><div class="reward-row"><span>3rd · bronze echo title</span><b>◈ 75</b></div><small>Titles are keepsakes; rewards stack across different weekly categories.</small></article><article class="incentive-card monthly"><div class="incentive-mark">☼</div><h4>Monthly covenant contest</h4><p>Every character who contributed power to a covenant that month shares its placement reward.</p><div class="reward-row"><span>1st · winning covenant banner</span><b>◈ 200 each</b></div><div class="reward-row"><span>2nd · honored covenant</span><b>◈ 125 each</b></div><div class="reward-row"><span>3rd · steadfast covenant</span><b>◈ 75 each</b></div><small>Cosmetic honors change with the season; no faction receives a permanent combat bonus.</small></article></div><div class="incentive-foot">Ties share the same placement reward. In this local preview, rewards are a schedule only; server-wide standings and automatic payouts need the shared-world service.</div></section>`}
const oldFactionsForChapters=factionsPage;factionsPage=function(){return oldFactionsForChapters()+leaderboardIncentives()+chapterPanel()};
const renderBeforeSocial=render;render=function(){renderBeforeSocial();if(page==='sanctuary'){let form=document.getElementById('chat-form');if(form)form.onsubmit=e=>{e.preventDefault();let text=new FormData(form).get('message').trim();if(!text)return;let c=cur();S.chat.push({channel:S.chatChannel==='faction'?'faction':'world',faction:c.faction,sender:c.name,text:text.slice(0,240),time:Date.now()});S.chat=S.chat.slice(-300);save();render();document.querySelector('#chat-form input')?.focus()};document.querySelectorAll('[data-chat-channel]').forEach(b=>b.onclick=()=>{S.chatChannel=b.dataset.chatChannel;save();render()})}if(page==='factions'){let form=document.getElementById('chapter-form');if(form)form.onsubmit=e=>{e.preventDefault();let name=new FormData(form).get('name').trim(),c=cur();if(name.length<3)return;if(S.chapters.some(ch=>ch.faction===c.faction&&ch.name.toLowerCase()===name.toLowerCase())){message('A chapter with that name already exists in this covenant.');return}S.chapters.push({id:crypto.randomUUID(),name:name.slice(0,28),faction:c.faction,founder:c.name,members:[c.id],createdAt:Date.now()});addFeed(`${c.name} founded the ${name} chapter of the ${factions[c.faction].name}.`);render()}}};
const actBeforeChapters=act;act=function(a,b){let c=cur(),chapter=(S.chapters||[]).find(x=>x.id===b?.dataset.chapter);if((a==='join-chapter'||a==='leave-chapter')&&chapter){if(chapter.faction!==c.faction){message('A character can only join a chapter within their own covenant.');return}if(a==='join-chapter'){S.chapters.forEach(ch=>{if(ch.faction===c.faction)ch.members=ch.members.filter(id=>id!==c.id)});chapter.members.push(c.id);addFeed(`${c.name} joined the ${chapter.name} chapter.`);message(`You joined ${chapter.name}.`)}else{chapter.members=chapter.members.filter(id=>id!==c.id);addFeed(`${c.name} left the ${chapter.name} chapter.`);message(`You left ${chapter.name}.`)}render();return}return actBeforeChapters(a,b)};

const chestPool=[...loot,{name:'Crooked Tin Saint',slot:'Charm',icon:'☼',rarity:'Common',power:2,value:18,desc:'A lucky tin figure with one crooked wing.'},{name:'Chapel Guard Coat',slot:'Armor',icon:'♜',rarity:'Common',power:3,value:24,desc:'A sturdy coat stitched from old choir banners.'}];
function drawChestItem(){let roll=Math.random()*100,rarity=roll<5?'Epic':roll<25?'Rare':roll<70?'Fine':'Common';return generateGear(Math.min(2,Math.floor((cur().pve||1)/20)),rarity)}
function curiosPage(){let c=cur();return `${head('Relics, curios & support','The crooked curiosity','Open a sealed chest for a random equipment find, or browse the card game. Chest odds are shown before you spend coin.')}<div class="callout">Chests use earned in-game coin in this local build. Duplicate gear can still be equipped, traded, or sold. No real-money purchases are enabled.</div><div class="stats">${stat('Your coin','◈ '+c.coins.toLocaleString(),'Current character') }${stat('Gear combinations','Many thousands','Names, affixes, stats & rarity are rolled')}${stat('Gear in your bag',c.bag.length,'Chest finds go straight to inventory')}${stat('Owned cards',S.cards.length,'Card collection · also open the Card duel tab')}</div><div class="chest-grid"><article class="chest-card"><div class="chest-art">♙<span>✧</span></div><div class="eyebrow">One sealed find</div><h3>Wayfarer’s Parcel</h3><p>A procedurally rolled piece of equipment: name, rarity, power, attribute bonuses, and strange history are generated when opened.</p><div class="odds"><span>Common 30%</span><span>Fine 45%</span><span>Rare 20%</span><span>Epic 5%</span></div><button class="btn gold" data-action="buy-chest" data-kind="single">Buy & open · ◈45</button></article><article class="chest-card rare-chest"><div class="chest-art">⚱<span>☾</span></div><div class="eyebrow">Two sealed finds</div><h3>Reliquary of the Bent Choir</h3><p>Two independent procedural gear rolls. Each gets a different name, rarity, power, bonuses, and bit of strange history.</p><div class="odds"><span>Common 30% each</span><span>Fine 45% each</span><span>Rare 20% each</span><span>Epic 5% each</span></div><button class="btn gold" data-action="buy-chest" data-kind="double">Buy & open · ◈90</button></article></div><section class="card chest-results"><div class="cardhead"><h3>Recent chest finds</h3><span class="tag">${S.chestLog.length} opened here</span></div>${S.chestLog.length?S.chestLog.slice(0,8).map(it=>itemrow(it)).join(''):'<p class="small">Your first parcel will leave its mark here.</p>'}</section><section class="donation-card"><div><div class="eyebrow">Keep the crooked lights burning</div><h3>Support the world</h3><p>Optional donations could help fund hosting and new art. The local prototype has no payment provider connected, so no charge can be made here.</p></div><div class="donate-options"><button class="btn ghost" disabled>Donate $2 · unavailable</button><button class="btn ghost" disabled>Donate $5 · unavailable</button><button class="btn ghost" disabled>Donate $10 · unavailable</button></div><small>Donation amounts, payment provider, and any supporter recognition can be configured before checkout is connected.</small></section>`}
function cardFace(card,small=false){return `<div class="playing-card ${card.rarity.toLowerCase()} ${small?'small-card':''}"><div class="card-rarity">${card.rarity}</div><div class="card-mark">${card.mark}</div><strong>${esc(card.name)}</strong><div class="card-stats"><span>⚔ ${card.attack}</span><span>⬡ ${card.ward}</span><span>☼ +${card.heal}</span></div><p>${esc(card.lore)}</p></div>`}
function cardGamePage(){let m=S.cardMatch,owned=cardsOfCrookedHalo.filter(x=>S.cards.includes(x.id));return `${head('A little game between roads','The Crooked Deck','A quick tactical card duel. Play one card each round: strike the rival, brace behind ward, or recover a little health. Win to discover a new card.')}<div class="callout">The deck is a collectible side game; its cards do not change your character’s combat build or leaderboard standing.</div>${m?`<section class="duel-board"><div class="duel-top"><div><div class="eyebrow">${m.done?(m.won?'The bell declares you the victor':'The rival takes the round'):'Round '+m.round+' · choose one card'}</div><h2>${m.done?(m.won?'A card for the collection!':'Back to the drawing table'):'Wayfarer versus the Wax Warden'}</h2></div><span class="tag gold">Local minigame</span></div><div class="duel-vitals"><div class="vital"><span>YOU</span><b>${Math.max(0,m.playerHp)} / 18</b><div class="bar"><i style="width:${Math.max(0,m.playerHp/18*100)}%"></i></div><small>Ward ${m.playerWard}</small></div><div class="duel-center">VS</div><div class="vital enemy"><span>WAX WARDEN</span><b>${Math.max(0,m.enemyHp)} / 18</b><div class="bar"><i style="width:${Math.max(0,m.enemyHp/18*100)}%"></i></div><small>Ward ${m.enemyWard}</small></div></div><div class="duel-log">${m.log.slice(0,5).map(x=>`<p>${esc(x)}</p>`).join('')}</div>${m.done?`<div class="duel-reward">${m.won?esc(m.reward||'Your collection grows.'):'The card table waits whenever you are ready.'}</div><button class="btn gold" data-action="card-start">Play again</button>`:`<h3>Your hand · choose a card</h3><div class="hand">${m.hand.map(id=>{let card=cardsOfCrookedHalo.find(x=>x.id===id);return `<button class="hand-button" data-action="card-play" data-card="${id}">${cardFace(card,true)}</button>`}).join('')}</div>`}</section>`:`<section class="duel-intro"><div class="deck-seal">♙</div><div><div class="eyebrow">Your collection · ${owned.length} / ${cardsOfCrookedHalo.length}</div><h2>Challenge the Wax Warden</h2><p>Build a hand from the cards you own. Use attacks to break the Warden’s guard, or ward and heal to outlast it. Your first four cards are waiting.</p><button class="btn gold" data-action="card-start">Begin card duel</button></div></section>`}<section class="card collection"><div class="cardhead"><h3>Card folio</h3><span class="tag">${owned.length} owned · ${cardsOfCrookedHalo.length-owned.length} sealed</span></div><div class="collection-grid">${cardsOfCrookedHalo.map(card=>S.cards.includes(card.id)?cardFace(card):`<div class="playing-card sealed"><div class="card-mark">?</div><strong>Sealed card</strong><p>Win a duel to uncover this face.</p></div>`).join('')}</div></section>`}
function beginCardDuel(){let deck=S.cards.length?S.cards:['tallow-saint','moth-scout','bellkeeper','rootward'];S.cardMatch={playerHp:18,playerWard:0,enemyHp:18,enemyWard:0,round:1,hand:Array.from({length:3},()=>deck[Math.floor(Math.random()*deck.length)]),log:['The Wax Warden rises from its little velvet chair.'],done:false,won:false};render()}
function playCard(id){let m=S.cardMatch;if(!m||m.done||!m.hand.includes(id))return;let card=cardsOfCrookedHalo.find(x=>x.id===id);if(!card)return;m.hand.splice(m.hand.indexOf(id),1);let damage=Math.max(0,card.attack-m.enemyWard);m.enemyWard=Math.max(0,m.enemyWard-card.attack);if(card.attack){m.enemyHp-=damage;m.log.unshift(`${card.name} strikes for ${damage} damage.`)}if(card.ward){m.playerWard+=card.ward;m.log.unshift(`${card.name} raises ${card.ward} ward.`)}if(card.heal){let recovered=Math.min(card.heal,18-m.playerHp);m.playerHp+=recovered;m.log.unshift(`${card.name} restores ${recovered} health.`)}if(m.enemyHp<=0){m.enemyHp=0;m.done=true;m.won=true;let locked=cardsOfCrookedHalo.filter(x=>!S.cards.includes(x.id));if(locked.length){let reward=locked[Math.floor(Math.random()*locked.length)];S.cards.push(reward.id);m.reward=`New card discovered: ${reward.name}!`}else{cur().coins+=30;m.reward='The folio is complete. You found ◈30 in the Warden’s coat.'}save();render();return}let enemyActs=Math.random()<.28;if(enemyActs){m.enemyWard+=2;m.log.unshift('The Wax Warden hides behind a little wall of candle wax.')}else{let raw=2+Math.floor(Math.random()*3),hit=Math.max(0,raw-m.playerWard);m.playerWard=Math.max(0,m.playerWard-raw);m.playerHp-=hit;m.log.unshift(`The Wax Warden jabs for ${hit} damage.`)}if(m.playerHp<=0){m.playerHp=0;m.done=true;m.won=false;m.log.unshift('Your cards scatter across the floorboards.')}else{let deck=S.cards;m.hand.push(deck[Math.floor(Math.random()*deck.length)]);m.round++}save();render()}
const socialRenderBeforeExtras=render;render=function(){if(page==='curios'||page==='cardgame'){updateTop();document.getElementById('main').innerHTML=page==='curios'?curiosPage():cardGamePage();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));return}socialRenderBeforeExtras()};
const socialActBeforeExtras=act;act=function(a,b){let c=cur();if(a==='buy-chest'){let count=b.dataset.kind==='double'?2:1,price=count===2?90:45;if(c.coins<price){message(`You need ◈${price} for this chest; you have ◈${c.coins}.`);return}c.coins-=price;let found=Array.from({length:count},drawChestItem);c.bag.push(...found);S.chestLog.unshift(...found);S.chestLog=S.chestLog.slice(0,16);found.forEach(x=>addFeed(`${c.name} found ${x.name} in a sealed chest.`));render();message(`Chest opened: ${found.map(x=>x.name).join(' · ')}.`);return}if(a==='card-start'){beginCardDuel();return}if(a==='card-play'){playCard(b.dataset.card);return}return socialActBeforeExtras(a,b)};

const npcQuests=[{id:'first-omen',npc:'Ilyra Bellkeeper',role:'Lantern Warden',mark:'☼',line:'“The map is lying again. Find one place where the ink has begun to whisper, and tell me what it says.”',objective:'Record one new omen at a marked place on the world map.',type:'omen',goal:1,coins:40,xp:45,honorType:'explore',honor:25,power:30},{id:'drowned-choir',npc:'Brother Salt',role:'Drowned Watch',mark:'⚱',line:'“Two voices still ring beneath the chapel. Quiet them gently, if you can. Quiet them quickly, if you cannot.”',objective:'Win two PvE encounters against the things haunting the roads.',type:'defeat',goal:2,coins:60,xp:70,honorType:'pve',honor:30,power:40},{id:'rook-parcel',npc:'Rook-of-Moths',role:'Pilgrim Market courier',mark:'♙',line:'“I lost the seal on a parcel. Bring me two pieces of recovered gear and I’ll pretend I meant to send them to you.”',objective:'Find two pieces of equipment from encounters or sealed chests.',type:'gear',goal:2,coins:50,xp:55,honorType:'craft',honor:20,power:30}];
function questState(){let id=cur().id;S.questLog[id]=S.questLog[id]||{active:[],completed:[]};return S.questLog[id]}

const actBeforeQuestHall=act;act=function(a,b){let c=cur(),id=b?.dataset.quest,q=npcQuests.find(x=>x.id===id);if(a==='open-quests'){go('quests');return}if(a==='quest-accept'&&q){let st=questState();if(st.completed.includes(id)){message('That favor is already fulfilled on this character.');return}if(st.active.some(x=>x.id===id))return;if(st.active.length>=3){message('This character can carry up to three active favors at once. Turn one in before accepting another.');return}st.active.push({id,progress:0,accepted:Date.now()});addFeed(`${c.name} accepted a favor from ${q.npc}.`);render();message(`${q.npc}: “${q.line.replace(/^“|”$/g,'')}”`);return}if(a==='quest-turnin'&&q){let st=questState(),at=st.active.findIndex(x=>x.id===id),record=st.active[at];if(!record||record.progress<q.goal){message('That favor is not ready to turn in yet.');return}st.active.splice(at,1);st.completed.push(id);c.coins+=q.coins;award(c,'pve',q.xp);points(S.weekly[q.honorType],c.id,q.honor);power(c.faction,q.power);addFeed(`${c.name} fulfilled ${q.npc}’s favor and earned ◈${q.coins}.`);save();render();message(`Favor fulfilled! +◈${q.coins}, +${q.xp} PvE XP, +${q.honor} weekly honor, and +${q.power} covenant power.`);return}if(a==='map-discover'){let before=S.discoveries?.length||0;actBeforeQuestHall(a,b);let found=(S.discoveries?.length||0)-before;if(found>0){questProgress('omen',found);render()}return}if(a==='buy-chest'){let before=c.bag.length;actBeforeQuestHall(a,b);let found=cur().bag.length-before;if(found>0){questProgress('gear',found);render()}return}return actBeforeQuestHall(a,b)};
const exploreBeforeQuest=explore;explore=function(){let c=cur(),before=c.bag.length;exploreBeforeQuest();if(S.feed[0]?.startsWith('You overcame'))questProgress('defeat',1);let found=cur().bag.length-before;if(found>0)questProgress('gear',found);render()};

const actBeforeRebirth=act;act=function(a,b){if(a==='open-rebirth'){let track=b.dataset.track,c=cur();if(!['pve','pvp'].includes(track)||c[track]!==99){message('This path must reach level 99 before it can be reborn.');return}rebirthModal(track);return}if(a==='confirm-rebirth'){let track=b.dataset.track,c=cur();if(!['pve','pvp'].includes(track)||c[track]!==99){closeModal();message('This path must reach level 99 before it can be reborn.');return}let stat=b.dataset.stat,name=b.dataset.name;if(!['Might','Vigor','Grace','Insight','Spirit'].includes(stat))return;c.legacyMarks=c.legacyMarks||[];c.legacyMarks.push({track,name,stat,at:Date.now()});c[track+'Rebirth']=(c[track+'Rebirth']||0)+1;c[track]=0;c[track+'Xp']=0;closeModal();addFeed(`${c.name} began again on the ${track==='pve'?'PvE':'PvP'} path as a ${name}.`);save();render();message(`Rebirth complete. ${track.toUpperCase()} returned to level 0; permanent +2 ${stat} and +5% ${track.toUpperCase()} XP gained.`);return}return actBeforeRebirth(a,b)};
