<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
<title id="title">The Wayfarer</title><desc id="desc">A highly expressive inked cartoon traveler with an oversized face, patched coat, bent halo shard, and sea-green shadows.</desc>
<defs>
 <linearGradient id="sky" x2="0.1" y2="1"><stop stop-color="#efd99d"/><stop offset=".52" stop-color="#e3bc77"/><stop offset="1" stop-color="#ad7957"/></linearGradient>
 <linearGradient id="coat" x2=".8" y2="1"><stop stop-color="#6c9a7d"/><stop offset=".53" stop-color="#3c675b"/><stop offset="1" stop-color="#263f43"/></linearGradient>
 <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#ffe9bd"/><stop offset=".72" stop-color="#e6b881"/><stop offset="1" stop-color="#c7825e"/></linearGradient>
 <pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M1 2h2m3 5h2M4 8l1-1" stroke="#48353b" stroke-width=".8" opacity=".23"/></pattern>
 <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><path d="M0 0v8" stroke="#221d27" stroke-width="1.3" opacity=".38"/></pattern>
 <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#49383c" opacity=".24"/></pattern>
 <filter id="ink-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence baseFrequency=".035" numOctaves="2" seed="9" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter>
</defs>
