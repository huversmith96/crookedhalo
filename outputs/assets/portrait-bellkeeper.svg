<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
<title id="title">Ilyra Bellkeeper</title><desc id="desc">A warmly eccentric bellkeeper in an oversized brass bell bonnet, with expressive eyes, patched velvet coat, charms, and hand-inked hatching.</desc>
<defs>
 <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M1 3h3m4 6h2M4 11h1" stroke="#49383c" stroke-width=".7" opacity=".24"/></pattern>
 <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)"><path d="M0 0v7" stroke="#302630" stroke-width="1.1" opacity=".42"/></pattern>
 <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#17151a" opacity=".62"/></pattern>
 <pattern id="stitch" width="14" height="10" patternUnits="userSpaceOnUse"><path d="M1 2h7" stroke="#e7b96d" stroke-width="2" stroke-linecap="round"/></pattern>
 <linearGradient id="brass" x2=".3" y2="1"><stop stop-color="#ffe7a7"/><stop offset=".43" stop-color="#d79a45"/><stop offset="1" stop-color="#8e512c"/></linearGradient>
 <linearGradient id="coat" x2=".8" y2="1"><stop stop-color="#995b4d"/><stop offset="1" stop-color="#49383c"/></linearGradient>
</defs>
